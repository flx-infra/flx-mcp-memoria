# ---------------------------------------------------------------------------
# flx-mcp-memoria: memoria compartida de los agentes de Flexxus (servidor MCP)
#
# Codigo e imagen: bitbucket.org/flexxus_id/flx-mcp-memoria
# Este repo es solo el stack: lo que Portainer despliega.
#
# Sin estado propio: todo queda en la base (stack flx-agentes-db).
# Sin puerto publicado ni tokens: lo usan los stacks conectados a la red "flx-agentes"
# (el Asistente) con http://flx-mcp-memoria_mcp:8100/mcp. Para conectar Claude Code desde
# afuera habria que publicar un puerto y cargar MEMORIA_TOKEN_LECTURA.
#
# Variables del stack: SERVICE_NAME, NODE, LOKI_URL.
# ---------------------------------------------------------------------------
version: '3.6'

services:
  mcp:
    image: fabreguesm/flx-mcp-memoria:0.3.0
    hostname: flx-mcp-memoria
    networks:
      - agentes
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - PGHOST=flx-agentes-db_postgres
      - PGUSER=flx_agentes
      - PGDATABASE=flx_agentes
    deploy:
      placement:
        constraints: ["${NODE}"]
      restart_policy:
        condition: any
        delay: 10s
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

networks:
  agentes:
    external: true
    name: flx-agentes
